<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就活トラッカー</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1a1a2e">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Shippori+Mincho:wght@400;600&display=swap');
  :root{--ink:#1a1a2e;--paper:#f5f0e8;--cream:#ede8dc;--accent:#8b5e3c;--accent-light:#c4956a;--line:#d4c9b0;--ok:#4a7c59;--warn:#c0392b;--tag-bg:#e8e0d0;--shadow:rgba(139,94,60,0.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}

  /* ログイン画面 */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:white;border:1px solid var(--line);border-radius:8px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 4px 24px var(--shadow);}
  .login-title{font-family:'Shippori Mincho',serif;font-size:1.4rem;text-align:center;margin-bottom:6px;}
  .login-sub{font-size:0.78rem;text-align:center;opacity:0.45;margin-bottom:28px;}
  .login-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .login-group label{font-size:0.75rem;font-weight:700;letter-spacing:0.06em;opacity:0.55;}
  .login-group input{font-family:inherit;font-size:0.9rem;border:1px solid var(--line);border-radius:4px;padding:9px 12px;}
  .login-group input:focus{outline:none;border-color:var(--accent-light);}
  .login-error{font-size:0.78rem;color:var(--warn);margin-bottom:10px;min-height:1.2em;}
  .btn-login{width:100%;background:var(--ink);color:var(--paper);border:none;padding:11px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.9rem;font-weight:700;letter-spacing:0.05em;margin-top:4px;transition:opacity 0.2s;}
  .btn-login:hover{opacity:0.85;}
  .setup-toggle{text-align:center;margin-top:18px;font-size:0.75rem;opacity:0.4;cursor:pointer;}
  .setup-toggle:hover{opacity:0.7;}
  .setup-area{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:none;}
  .setup-area.open{display:block;}
  .setup-area input{width:100%;font-family:inherit;font-size:0.78rem;border:1px solid var(--line);border-radius:4px;padding:7px 10px;margin-bottom:8px;}
  .btn-sm{background:var(--accent);color:white;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.8rem;font-weight:700;}
  .url-status{font-size:0.73rem;margin-top:2px;}
  .url-status.ok{color:var(--ok);}.url-status.err{color:var(--warn);}

  /* ヘッダー */
  header{background:var(--ink);color:var(--paper);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .header-left{display:flex;align-items:baseline;gap:10px;}
  header h1{font-family:'Shippori Mincho',serif;font-size:1.3rem;letter-spacing:0.1em;}
  .header-user{font-size:0.8rem;opacity:0.7;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .admin-select{font-family:inherit;font-size:0.8rem;padding:4px 8px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;background:rgba(255,255,255,0.1);color:var(--paper);cursor:pointer;}
  .admin-select option{background:var(--ink);color:var(--paper);}
  .btn-logout{background:none;border:1px solid rgba(255,255,255,0.3);color:var(--paper);padding:5px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.78rem;transition:background 0.2s;}
  .btn-logout:hover{background:rgba(255,255,255,0.1);}

  /* ナビ */
  nav{background:var(--cream);border-bottom:1px solid var(--line);padding:0 20px;display:flex;}
  nav button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 18px;cursor:pointer;font-family:inherit;font-size:0.85rem;color:var(--ink);opacity:0.55;transition:all 0.2s;}
  nav button.active{opacity:1;border-bottom-color:var(--accent);font-weight:700;}

  main{padding:24px 20px;max-width:1200px;margin:0 auto;}

  /* ─── ページ切り替えアニメーション ─── */
  .page{display:none;}.page.active{display:block;}
  main{perspective:1200px;}

  @keyframes flipInFromRight{
    0%  {opacity:0;transform:rotateY(-18deg) translateX(40px) scale(0.97);}
    100%{opacity:1;transform:rotateY(0deg)   translateX(0px)   scale(1);}
  }
  @keyframes flipInFromLeft{
    0%  {opacity:0;transform:rotateY(18deg)  translateX(-40px) scale(0.97);}
    100%{opacity:1;transform:rotateY(0deg)   translateX(0px)   scale(1);}
  }
  @keyframes fadeSlideUp{
    0%  {opacity:0;transform:translateY(12px);}
    100%{opacity:1;transform:translateY(0);}
  }

  .page.active.anim-flip-right{animation:flipInFromRight 0.38s cubic-bezier(0.22,0.61,0.36,1) both;}
  .page.active.anim-flip-left {animation:flipInFromLeft  0.38s cubic-bezier(0.22,0.61,0.36,1) both;}
  .page.active.anim-fade      {animation:fadeSlideUp     0.28s ease both;}

  /* ─── フォームページのカードデザイン ─── */
  #page-form.active{
    background:linear-gradient(160deg,#edf2f9 0%,#e2ecf7 100%);
    border-radius:12px;
    box-shadow:0 8px 40px rgba(60,90,140,0.14),0 2px 8px rgba(60,90,140,0.08);
    padding:28px 24px 32px;
    transform-origin:top center;
  }
  #page-form.active .section-divider{border-top-color:#b8cce0;color:#5a7a9a;}
  #page-form.active .form-actions{border-top-color:#b8cce0;}
  #page-form.active .btn-back{border-color:#b8cce0;}
  #page-form.active .btn-back:hover{background:#d8e8f4;}
  #page-form.active .form-group input,
  #page-form.active .form-group select,
  #page-form.active .form-group textarea,
  #page-form.active .url-row input,
  #page-form.active .url-row-label{background:white;border-color:#b8cce0;}
  #page-form.active .form-group input:focus,
  #page-form.active .form-group select:focus,
  #page-form.active .form-group textarea:focus{border-color:#6a9ac4;}
  #page-form.active .btn-url-add{border-color:#8ab0d0;color:#3a6a9a;}
  #page-form.active .btn-url-add:hover{background:#d8e8f4;}
  #page-form.active .admin-section-divider{border-top-color:#e05050;}
  #page-form.active .btn-primary{background:#3a6a9a;}
  #page-form.active .btn-primary:hover{background:#4a7aaa;}

  /* 管理者パネル */
  .admin-panel{background:#f0f4ff;border:1px solid #c0ccee;border-radius:6px;padding:16px;margin-bottom:20px;}
  .admin-panel h3{font-size:0.85rem;font-weight:700;margin-bottom:12px;opacity:0.7;letter-spacing:0.06em;}
  .user-table{width:100%;border-collapse:collapse;font-size:0.82rem;margin-bottom:12px;}
  .user-table th,.user-table td{padding:7px 10px;border:1px solid #d0d8ee;text-align:left;}
  .user-table th{background:#e0e8ff;color:var(--ink);font-weight:700;}
  .btn-danger-sm{background:none;border:1px solid #e0b0b0;color:var(--warn);padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.75rem;}
  .add-user-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
  .add-user-row input,.add-user-row select{font-family:inherit;font-size:0.82rem;border:1px solid var(--line);border-radius:4px;padding:6px 10px;width:130px;}
  .add-user-row input::placeholder{font-size:0.75rem;}

  /* ツールバー */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .company-count{font-size:0.8rem;opacity:0.5;}
  .btn-primary{background:var(--accent);color:white;border:none;padding:9px 20px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:700;letter-spacing:0.05em;transition:background 0.2s;}
  .btn-primary:hover{background:var(--accent-light);}
  .sort-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .sort-bar label{font-size:0.75rem;opacity:0.5;}
  .sort-bar select{font-family:inherit;font-size:0.78rem;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:white;cursor:pointer;}

  /* カード */
  .card-list{display:flex;flex-direction:column;gap:10px;}
  .card{background:white;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;transition:box-shadow 0.2s,border-left-color 0.2s;}
  .card:hover{box-shadow:0 3px 12px var(--shadow);}
  .card.priority-high{border-left-color:var(--accent);}.card.priority-mid{border-left-color:var(--accent-light);}
  .card.is-closed{background:#f0f0f0;border-left-color:#ccc !important;opacity:0.55;}
  .card.is-closed:hover{opacity:0.8;}
  .card.is-closed .card-name{color:#999;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-name{font-family:'Shippori Mincho',serif;font-size:1.05rem;font-weight:600;}
  .card-industry{font-size:0.72rem;background:var(--tag-bg);padding:2px 8px;border-radius:99px;white-space:nowrap;margin-top:2px;}
  .card-meta{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .card-meta-item{font-size:0.75rem;opacity:0.65;display:flex;gap:4px;align-items:center;}
  .stars{color:var(--accent);letter-spacing:-1px;font-size:0.85rem;}
  .status-badge{font-size:0.7rem;padding:2px 8px;border-radius:99px;font-weight:700;letter-spacing:0.04em;}
  .status-0{background:#e8e0f0;color:#6040a0;}.status-1{background:#eee;color:#888;}
  .status-2{background:#dceeff;color:#2060a0;}.status-3{background:#fff3cd;color:#856404;}
  .status-4{background:#d4edda;color:#155724;}.status-5{background:#f8d7da;color:#721c24;}
  .status-6{background:#d6f0ee;color:#0e6b64;}
  .status-7{background:#ffe4c7;color:#8a4b00;}
  .empty-state{text-align:center;padding:60px 20px;opacity:0.4;font-size:0.9rem;line-height:2;}
  .loading{text-align:center;padding:40px;opacity:0.4;font-size:0.85rem;}

  /* フォーム */
  .form-header{display:flex;gap:10px;margin-bottom:24px;align-items:center;}
  .btn-back{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.8rem;color:var(--ink);transition:background 0.15s;}
  .btn-back:hover{background:var(--cream);}
  .form-title{font-family:'Shippori Mincho',serif;font-size:1.15rem;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
  .form-full{grid-column:1/-1;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group label{font-size:0.75rem;font-weight:700;letter-spacing:0.06em;opacity:0.6;text-transform:uppercase;}
  .form-group input,.form-group select,.form-group textarea{font-family:inherit;font-size:0.9rem;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:white;color:var(--ink);transition:border-color 0.15s;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent-light);}
  .form-group textarea{resize:vertical;min-height:80px;}
  .star-rating{display:flex;flex-direction:row-reverse;gap:4px;}
  .star-rating input{display:none;}
  .star-rating label{font-size:1.4rem;color:var(--line);cursor:pointer;transition:color 0.1s;text-transform:none;letter-spacing:0;opacity:1;font-weight:400;}
  .star-rating input:checked~label,.star-rating label:hover,.star-rating label:hover~label{color:var(--accent);}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);}
  .btn-danger{background:none;border:1px solid #e0b0b0;color:var(--warn);padding:8px 16px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.85rem;margin-right:auto;}
  .btn-danger:hover{background:#fff0f0;}
  .section-divider{grid-column:1/-1;font-size:0.72rem;font-weight:700;letter-spacing:0.12em;opacity:0.4;text-transform:uppercase;padding-top:8px;border-top:1px solid var(--line);}

  /* 比較表 */
  .compare-hint{font-size:0.8rem;opacity:0.5;margin-bottom:8px;}
  .compare-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .compare-filter label{font-size:0.78rem;display:flex;align-items:center;gap:4px;cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:white;transition:background 0.15s;}
  .compare-filter label:hover{background:var(--cream);}
  .compare-filter input[type=checkbox]{accent-color:var(--accent);}
  .compare-filter-title{font-size:0.75rem;opacity:0.5;}
  .compare-table-wrap{overflow-x:auto;}
  .compare-table-wrap table th:nth-child(1){width:20%;}
  .compare-table-wrap table th:nth-child(2){width:9%;}
  .compare-table-wrap table th:nth-child(3){width:11%;}
  .compare-table-wrap table th:nth-child(4){width:9%;}
  .compare-table-wrap table th:nth-child(5){width:8%;}
  .compare-table-wrap table th:nth-child(6){width:8%;}
  .compare-table-wrap table th:nth-child(7){width:8%;}
  .compare-table-wrap table th:nth-child(8){width:8%;}
  .compare-table-wrap table th:nth-child(9){width:5%;}
  .compare-table-wrap table th:nth-child(10){width:9%;}
  table{width:100%;border-collapse:collapse;font-size:0.82rem;table-layout:fixed;}
  th,td{padding:10px 12px;border:1px solid var(--line);text-align:left;vertical-align:top;}
  th{background:var(--ink);color:var(--paper);font-weight:400;letter-spacing:0.05em;white-space:nowrap;}
  tr:nth-child(even) td{background:var(--cream);}
  td{word-break:break-all;}
  td.company-name-cell{font-family:'Shippori Mincho',serif;font-weight:600;white-space:normal;word-break:break-all;cursor:pointer;color:var(--accent);}
  td.company-name-cell:hover{text-decoration:underline;}
  .rating-cell{color:var(--accent);white-space:nowrap;}

  .update-badge{display:inline-block;font-size:0.7rem;background:#fff3cd;color:#856404;border:1px solid #ffe08a;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;}
  .notif-wrap{position:relative;}
  .btn-notif{background:none;border:1px solid rgba(255,255,255,0.3);color:var(--paper);padding:5px 12px;border-radius:4px;cursor:pointer;font-size:1rem;position:relative;}
  .notif-count{position:absolute;top:-6px;right:-6px;background:#e53e3e;color:white;font-size:0.65rem;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .notif-panel{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:white;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 20px var(--shadow);z-index:100;max-height:400px;display:flex;flex-direction:column;}
  .notif-header{padding:10px 14px;font-size:0.82rem;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--ink);}
  .notif-close{background:none;border:none;cursor:pointer;font-size:0.85rem;opacity:0.4;}
  .notif-close:hover{opacity:1;}
  .notif-list-inner{overflow-y:auto;flex:1;}
  .notif-user-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px;}
  .notif-user-info{display:flex;flex-direction:column;gap:2px;}
  .notif-user-name{font-size:0.85rem;font-weight:700;color:var(--ink);}
  .notif-user-count{font-size:0.72rem;color:var(--accent-light);}
  .btn-notif-read{background:none;border:1px solid var(--line);color:var(--ink);padding:4px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.72rem;white-space:nowrap;opacity:0.7;}
  .btn-notif-read:hover{background:var(--cream);opacity:1;}
  .notif-empty{padding:24px;text-align:center;font-size:0.8rem;opacity:0.4;}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:20px;font-size:0.82rem;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
  #toast.show{opacity:1;}

  /* 動的URL欄 */
  .url-list{display:flex;flex-direction:column;gap:8px;}
  .url-row{display:flex;gap:6px;align-items:center;}
  .url-row-label{font-family:inherit;font-size:0.82rem;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:white;color:var(--ink);width:110px;flex-shrink:0;}
  .url-row-label:focus{outline:none;border-color:var(--accent-light);}
  .url-row-label::placeholder{font-size:0.75rem;color:#bbb;}
  .url-row input{flex:1;font-family:inherit;font-size:0.9rem;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:white;color:var(--ink);}
  .url-row input:focus{outline:none;border-color:var(--accent-light);}
  .btn-url-open{font-size:0.78rem;padding:7px 11px;background:var(--accent);color:white;border-radius:4px;text-decoration:none;white-space:nowrap;font-weight:700;}
  .btn-url-remove{background:none;border:1px solid var(--line);color:#999;border-radius:4px;padding:6px 10px;cursor:pointer;font-size:0.85rem;line-height:1;flex-shrink:0;}
  .btn-url-remove:hover{border-color:#e05050;color:#e05050;}
  .btn-url-add{background:none;border:1px dashed var(--accent-light);color:var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;font-family:inherit;font-size:0.8rem;margin-top:2px;transition:background 0.15s;}
  .btn-url-add:hover{background:var(--cream);}

  /* 日程入力（フォーム） */
  .event-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
  .event-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .event-row .evf-type{width:150px;}
  .event-row .evf-date{width:150px;}
  .event-row .evf-end-wrap{align-items:center;gap:4px;font-size:0.78rem;white-space:nowrap;}
  .event-row .evf-end{width:150px;}
  .event-row .evf-time{width:105px;}
  .event-row .evf-note{flex:1;min-width:140px;}

  /* カレンダー */
  .cal-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .cal-nav{display:flex;align-items:center;gap:8px;}
  .cal-nav .btn-back{min-width:34px;}
  .cal-title{font-family:'Shippori Mincho',serif;font-size:1.15rem;min-width:7em;text-align:center;}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:0.72rem;opacity:0.85;}
  .cal-legend span{display:inline-flex;align-items:center;gap:4px;}
  .cal-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .ev-deadline{background:var(--warn);}.ev-interview{background:var(--ink);}.ev-briefing{background:var(--ok);}.ev-practicum{background:#0e7c74;}.ev-other{background:#8a8a8a;}
  .cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-dow div{text-align:center;font-size:0.72rem;font-weight:700;padding:6px 0;background:var(--ink);color:var(--paper);letter-spacing:0.05em;}
  .cal-grid{background:white;border-left:1px solid var(--line);border-top:1px solid var(--line);}
  .cal-cell{min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;transition:background 0.15s;}
  .cal-cell:hover{background:var(--cream);}
  .cal-cell.out{background:#faf8f3;}
  .cal-cell.out .cal-day{opacity:0.35;}
  .cal-day{display:inline-block;min-width:1.7em;padding:1px 4px;border-radius:99px;font-size:0.78rem;text-align:center;}
  .cal-cell.sun .cal-day{color:var(--warn);}
  .cal-cell.sat .cal-day{color:#2a5d9a;}
  .cal-cell.today .cal-day{background:var(--accent);color:white;}
  .cal-cell.selected{outline:2px solid var(--accent);outline-offset:-2px;}
  .cal-events{display:flex;flex-direction:column;gap:2px;margin-top:3px;}
  .cal-chip{font-size:0.68rem;line-height:1.35;padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:white;cursor:pointer;}
  .cal-chip.extra{display:none;}
  .cal-chip.ev-inactive{opacity:0.35;text-decoration:line-through;}
  .cal-more{font-size:0.66rem;opacity:0.6;padding-left:3px;}
  .cal-hint{font-size:0.8rem;opacity:0.5;padding:10px 2px;}
  .cal-detail{margin-top:14px;}
  .cal-detail-box{background:white;border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
  .cal-detail-head{font-weight:700;font-size:0.9rem;margin-bottom:6px;}
  .cal-ev-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:0.85rem;}
  .cal-detail-head+.cal-ev-row{border-top:none;}
  .ev-tag{font-size:0.68rem;font-weight:700;color:white;padding:1px 8px;border-radius:99px;white-space:nowrap;}
  .cal-ev-time{font-variant-numeric:tabular-nums;opacity:0.7;}
  .cal-ev-name{font-weight:700;color:var(--accent);cursor:pointer;}
  .cal-ev-name:hover{text-decoration:underline;}
  .cal-ev-note{font-size:0.78rem;opacity:0.65;}
  .cal-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .cal-add select,.cal-add input{font-family:inherit;font-size:0.8rem;border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:white;color:var(--ink);}
  .cal-add .qa-note{flex:1;min-width:120px;}
  .cal-add .qa-end-wrap{align-items:center;gap:4px;font-size:0.8rem;white-space:nowrap;}
  .cal-section-title{font-size:0.85rem;font-weight:700;letter-spacing:0.06em;margin:22px 0 8px;opacity:0.7;}
  .cal-up-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:white;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-size:0.85rem;}
  .cal-up-row:hover{box-shadow:0 3px 12px var(--shadow);}
  .cal-up-row.ev-b-deadline{border-left-color:var(--warn);}
  .cal-up-row.ev-b-interview{border-left-color:var(--ink);}
  .cal-up-row.ev-b-briefing{border-left-color:var(--ok);}

  .cal-up-date{font-weight:700;min-width:5.5em;}

  .cal-scope{font-family:inherit;font-size:0.8rem;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink);cursor:pointer;}
  .cal-status{font-size:0.78rem;opacity:0.7;margin:-4px 0 8px;}
  .cal-status:empty{display:none;}
  .cal-ev-owner{font-size:0.72rem;font-weight:700;background:var(--tag-bg);padding:1px 8px;border-radius:99px;white-space:nowrap;}
  @media(max-width:600px){
    .cal-cell{min-height:56px;padding:2px;}
    .cal-events{flex-direction:row;flex-wrap:wrap;gap:3px;}
    .cal-chip,.cal-chip.extra{display:block;width:7px;height:7px;padding:0;border-radius:50%;pointer-events:none;}
    .cal-chip .chip-text,.cal-more{display:none;}
  }
</style>
</head>

<script>
const GAS_URL_KEY='shushoku_gas_url';
const SESSION_KEY='shushoku_session';
const STATUS_LABELS=['検討中','ボツ','書類選考中','面接待ち','内定','不採用・辞退','実習待ち','面接結果待ち'];
const PRIORITY_LABELS={high:'高',mid:'中',low:'低'};

let gasUrl='',session=null,companies=[],editingId=null,currentSheetName='',returnPage='list';

// ─── 初期化 ───
window.onload=()=>{
  gasUrl=localStorage.getItem(GAS_URL_KEY)||'';
  if(gasUrl) document.getElementById('gas-url-input').value=gasUrl;

  const saved=localStorage.getItem(SESSION_KEY);
  if(saved){
    try{
      session=JSON.parse(saved);
      enterMain();
    }catch{showLogin();}
  }else{
    showLogin();
  }
};

function showLogin(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('main-screen').style.display='none';
}
function enterMain(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  document.getElementById('header-user').textContent=session.username+' さん';
  if(session.role==='admin'){
    document.getElementById('admin-tab').style.display='inline-block';
    document.getElementById('admin-user-select').style.display='inline-block';
    document.getElementById('notif-wrap').style.display='block';
    loadUsers();
    renderList();
  }else{
    currentSheetName=session.sheetName;
    loadFromSheet();
  }
  startNotifPoll();
}

function toggleSetup(){
  const a=document.getElementById('setup-area');
  a.classList.toggle('open');
}
function saveGasUrl(){
  const url=document.getElementById('gas-url-input').value.trim();
  if(!url.startsWith('https://script.google.com')){setUrlStatus('URLが正しくないようです。',false);return;}
  gasUrl=url;localStorage.setItem(GAS_URL_KEY,gasUrl);
  setUrlStatus('保存しました',true);
}
function setUrlStatus(msg,ok){
  const el=document.getElementById('url-status');el.textContent=msg;
  el.className='url-status'+(ok===true?' ok':ok===false?' err':'');
}

async function doLogin(){
  const username=document.getElementById('login-username').value.trim();
  const password=document.getElementById('login-password').value;
  if(!gasUrl){document.getElementById('login-error').textContent='先にGAS URLを設定してください。';return;}
  if(!username||!password){document.getElementById('login-error').textContent='ユーザー名とパスワードを入力してください。';return;}
  document.getElementById('login-error').textContent='';
  try{
    const result=await api({action:'login',username,password});
    if(result.error){document.getElementById('login-error').textContent=result.error;return;}
    session=result;
    localStorage.setItem(SESSION_KEY,JSON.stringify(session));
    enterMain();
  }catch(e){document.getElementById('login-error').textContent='接続に失敗しました。';}
}

// ─── 通知（管理者のみ） ───
let notifications=[];
let notifPollTimer=null;

async function loadNotifications(){
  if(!session||session.role!=='admin')return;
  try{
    const result=await api({action:'getNotifications'});
    if(result.error||!result.notifications)return;
    notifications=result.notifications;
    renderNotifBadge();
  }catch(e){}
}

function renderNotifBadge(){
  const users=new Set(notifications.map(n=>n.fromUser));
  const count=users.size;
  const badge=document.getElementById('notif-count');
  if(count>0){
    badge.textContent=count;
    badge.style.display='flex';
  }else{
    badge.style.display='none';
  }
}

function toggleNotifPanel(){
  const panel=document.getElementById('notif-panel');
  const isOpen=panel.style.display!=='none';
  panel.style.display=isOpen?'none':'flex';
  panel.style.flexDirection='column';
  if(!isOpen)renderNotifList();
}

function renderNotifList(){
  const list=document.getElementById('notif-list');
  if(!notifications.length){
    list.innerHTML='<div class="notif-empty">新しい通知はありません</div>';
    return;
  }
  const byUser={};
  notifications.forEach(n=>{
    if(!byUser[n.fromUser])byUser[n.fromUser]={count:0,latest:0};
    byUser[n.fromUser].count++;
    if(Number(n.timestamp)>byUser[n.fromUser].latest)byUser[n.fromUser].latest=Number(n.timestamp);
  });
  const sorted=Object.entries(byUser).sort((a,b)=>b[1].latest-a[1].latest);
  list.innerHTML='<div class="notif-list-inner">'+sorted.map(([username,info])=>{
    return`<div class="notif-user-row">
      <div class="notif-user-info">
        <span class="notif-user-name">${esc(username)}</span>
        <span class="notif-user-count">${info.count}件の更新</span>
      </div>
      <button class="btn-notif-read" onclick="markReadByUser('${esc(username)}')">既読にする</button>
    </div>`;
  }).join('')+'</div>';
}

async function markReadByUser(fromUser){
  await api({action:'markReadByUser',fromUser});
  notifications=notifications.filter(n=>n.fromUser!==fromUser);
  renderNotifBadge();
  renderNotifList();
}

function startNotifPoll(){
  loadNotifications();
  notifPollTimer=setInterval(loadNotifications,60000);
}
function stopNotifPoll(){
  if(notifPollTimer){clearInterval(notifPollTimer);notifPollTimer=null;}
}

function doLogout(){
  stopNotifPoll();
  session=null;
  localStorage.removeItem(SESSION_KEY);
  companies=[];
  currentSheetName='';
  // 管理者UIをリセット
  document.getElementById('admin-tab').style.display='none';
  document.getElementById('admin-user-select').style.display='none';
  document.getElementById('admin-user-select').innerHTML='';
  showLogin();
}

// ─── 管理者：利用者切り替え ───
async function loadUsers(){
  const result=await api({action:'getUsers'});
  if(result.error||!result.users)return;
  userList=result.users;
  const sel=document.getElementById('admin-user-select');
  sel.innerHTML='<option value="">── 利用者を選択 ──</option>';
  result.users.filter(u=>u.role!=='admin').forEach(u=>{
    const opt=document.createElement('option');
    opt.value=u.sheetName;
    opt.textContent=u.sheetName;
    sel.appendChild(opt);
  });
  renderUserTable(result.users);
}

function renderUserTable(users){
  document.getElementById('user-table-body').innerHTML=users.filter(u=>u.role!=='admin').map(u=>`
    <tr>
      <td>${esc(u.username)}</td>
      <td>${esc(u.sheetName)}</td>
      <td><span id="del-${esc(u.username)}"><button class="btn-danger-sm" onclick="confirmDeleteUser('${esc(u.username)}')">削除</button></span></td>
    </tr>`).join('');
  document.getElementById('admin-table-body').innerHTML=users.filter(u=>u.role==='admin').map(u=>`
    <tr>
      <td>${esc(u.username)}</td>
      <td><span id="del-${esc(u.username)}"><button class="btn-danger-sm" onclick="confirmDeleteUser('${esc(u.username)}')">削除</button></span></td>
    </tr>`).join('');
}

function switchUser(){
  const sheetName=document.getElementById('admin-user-select').value;
  currentSheetName=sheetName;
  if(!sheetName){renderList();showPage('list');return;}
  loadFromSheet();
  showPage('list');
}

async function addUser(){
  const username=document.getElementById('new-username').value.trim();

// ─── API ───
async function api(payload){
  const body={...payload};
  if(session)body.token=session.token;
  // 管理者は選択中の利用者のシートを対象にする。ただし呼び出し側が sheetName を明示した場合はそちらを優先
  if(session&&session.role==='admin'&&currentSheetName&&!body.sheetName){
    body.sheetName=currentSheetName;
  }
  const res=await fetch(gasUrl,{method:'POST',body:JSON.stringify(body)});
  const data=await res.json();
  // authエラーは自動ログアウト
  if(data.error==='auth'){
    localStorage.removeItem(SESSION_KEY);
    session=null;
    showLogin();
    document.getElementById('login-error').textContent='セッションが切れました。再ログインしてください。';
    return data;
  }
  return data;
}

function normCompany(c){return{...c,rWork:Number(c.rWork)||0,rCulture:Number(c.rCulture)||0,rSupport:Number(c.rSupport)||0,rOverall:Number(c.rOverall)||0,updatedAt:Number(c.updatedAt)||0};}

async function loadFromSheet(){
  document.getElementById('card-list').innerHTML='<div class="loading">読み込み中…</div>';
  try{
    const result=await api({action:'getAll'});

}

// ─── ページ切り替え ───
async function unlockAndBack(){
  stopHeartbeat();
  if(editingId)await api({action:'unlock',id:editingId});
  editingId=null;
  goBack();
}
// フォームを閉じたあと、開いた元のページ（一覧 or カレンダー）へ戻る
function goBack(){
  const p=returnPage;returnPage='list';
  // 管理者の全員カレンダーから開いた場合、編集結果をカレンダー用のデータにも反映する
  if(p==='calendar'&&session&&session.role==='admin'&&allData&&allData[currentSheetName])allData[currentSheetName].companies=companies;
  showPage(p);
}

function showPage(name){
  const prev=document.querySelector('.page.active');
  const prevId=prev?prev.id:'';
  document.querySelectorAll('.page').forEach(p=>{p.classList.remove('active','anim-flip-right','anim-flip-left','anim-fade');});
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const next=document.getElementById('page-'+name);
  // フォームから戻るときは左フリップ、それ以外はフェード
  if(prevId==='page-form'){next.classList.add('active','anim-flip-left');}
  else{next.classList.add('active','anim-fade');}
  const btns=document.querySelectorAll('nav button');
  const map={list:0,compare:1,calendar:2,admin:3};
  if(map[name]!==undefined&&btns[map[name]])btns[map[name]].classList.add('active');
  if(name==='compare')renderCompare();
  if(name==='calendar'){renderCalendar();if(session&&session.role==='admin')loadAllSheets();}
  if(name==='list')renderList();
}

// ─── 星 ───
function getStars(name){const el=document.querySelector(`input[name="${name}"]:checked`);return el?parseInt(el.value):0;}
function setStars(name,val){document.querySelectorAll(`input[name="${name}"]`).forEach(r=>r.checked=false);if(val){const t=document.querySelector(`input[name="${name}"][value="${val}"]`);if(t)t.checked=true;}}
function renderStars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):'─';}

// ─── フォーム ───
async function openForm(id,from){
  if(!id&&session.role==='admin'&&!currentSheetName){
    showToast('先に利用者を選択してください');
    return;
  }
  returnPage=from||'list';
  editingId=id||null;

  // ロック確認（idがある場合のみ）
  if(id){
    const lockResult=await api({action:'lock',id});
    if(lockResult.error==='locked'){
      showToast('現在「'+lockResult.lockedBy+'」が編集中です');
      return;
    }
  }

  // ここからフォーム表示
  document.getElementById('form-title').textContent=id?'企業を編集':'企業を追加';
  document.getElementById('btn-form-back').textContent=returnPage==='calendar'?'← カレンダーへ':'← 一覧へ';
  document.getElementById('btn-delete').style.display=id?'inline-block':'none';
  ['name','industry','location','salary','work','culture','support','memo'].forEach(f=>{const el=document.getElementById('f-'+f);if(el)el.value='';});
  document.getElementById('f-employment').value='';
  document.getElementById('f-status').value='0';
  document.getElementById('f-priority').value='0';
  ['work','culture','support','overall'].forEach(n=>setStars('sr-'+n,0));
  if(id){
    const c=companies.find(x=>x.id===id);
    if(c){
      ['name','industry','location','employment','salary','work','culture','support','memo'].forEach(f=>{const el=document.getElementById('f-'+f);if(el)el.value=c[f]||'';});
      document.getElementById('f-status').value=c.status??'0';
      document.getElementById('f-priority').value=c.priority||'0';
      setStars('sr-work',c.rWork);setStars('sr-culture',c.rCulture);setStars('sr-support',c.rSupport);setStars('sr-overall',c.rOverall);
      // 提案フラグを消す
      if(c.updatedBy&&c.updatedBy!==session.username){
        api({action:'clearFlag',id:c.id});
        c.updatedBy='';
      }
    }
  }
  if(id)startHeartbeat(id);
  document.querySelectorAll('.page').forEach(p=>{p.classList.remove('active','anim-flip-right','anim-flip-left','anim-fade');});
  const formPage=document.getElementById('page-form');
  formPage.classList.add('active','anim-flip-right');
  setEventList(id?parseEvents(companies.find(x=>x.id===id)):[]);
  // ページ表示後にURL欄をセット（表示前だとurl-listがnullになるため必ずここで行う）
  if(id){
    const c=companies.find(x=>x.id===id);
    let urls=[];
    if(c){
      try{
        const parsed=JSON.parse(c.url||'[]');
        if(Array.isArray(parsed)){
          urls=parsed.map(item=>typeof item==='object'?item:{label:'',url:item});
        } else if(c.url){
          urls=[{label:'',url:c.url}];
        }
      }catch(e){ if(c.url)urls=[{label:'',url:c.url}]; }
    }
    setUrlList(urls);
  } else {
    setUrlList([]);
  }
}

let heartbeatTimer=null;
function startHeartbeat(id){
  stopHeartbeat();
  heartbeatTimer=setInterval(()=>{
    if(id)api({action:'heartbeat',id});
  },30000); // 30秒ごと
}
function stopHeartbeat(){
  if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}
}

async function saveCompany(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('企業名を入力してください。');return;}
  const urls=getUrlList();
  const data={
    id:editingId||(Date.now().toString(36)+Math.random().toString(36).slice(2)),
    updatedAt:Date.now(),name,
    url:JSON.stringify(urls),
    events:JSON.stringify(getEventList()),
    industry:document.getElementById('f-industry').value.trim(),
    location:document.getElementById('f-location').value.trim(),
    employment:document.getElementById('f-employment').value,
    salary:document.getElementById('f-salary').value.trim(),
    status:document.getElementById('f-status').value,
    work:document.getElementById('f-work').value.trim(),
    culture:document.getElementById('f-culture').value.trim(),
    support:document.getElementById('f-support').value.trim(),
    memo:document.getElementById('f-memo').value.trim(),
    priority:document.getElementById('f-priority').value,
    rWork:getStars('sr-work'),rCulture:getStars('sr-culture'),rSupport:getStars('sr-support'),rOverall:getStars('sr-overall'),
  };
  showToast('保存中…');
  try{
    const result=await api({action:'save',data});
    if(result.error)throw new Error(result.error);
    if(editingId){const idx=companies.findIndex(x=>x.id===editingId);if(idx>=0)companies[idx]=data;else companies.push(data);}
    else companies.push(data);
    stopHeartbeat();
    if(editingId)await api({action:'unlock',id:editingId});
    showToast('保存しました');goBack();
  }catch(e){showToast('保存に失敗しました：'+e.message);}
}

async function deleteCompany(){
  if(!editingId)return;
  const c=companies.find(x=>x.id===editingId);
  if(!confirm(`「${c?.name||''}」を削除しますか？`))return;
  showToast('削除中…');
  try{
    const result=await api({action:'delete',id:editingId});
    if(result.error)throw new Error(result.error);
    companies=companies.filter(x=>x.id!==editingId);
    showToast('削除しました');goBack();
  }catch(e){showToast('削除に失敗しました：'+e.message);}
}

// ─── 一覧 ───
function renderList(){
  if(session.role==='admin'&&!currentSheetName){
    document.getElementById('company-count').textContent='';
    document.getElementById('card-list').innerHTML='<div class="empty-state">上部の「利用者を選択」から表示する利用者を選んでください。</div>';
    return;
  }
  const sortKey=document.getElementById('sort-select').value;
  const sorted=[...companies].sort((a,b)=>{
    // 「ボツ」(status=1) は並び替えに関わらず常に末尾へ
    const aBotsu=(parseInt(a.status)||0)===1, bBotsu=(parseInt(b.status)||0)===1;
    if(aBotsu!==bBotsu)return aBotsu?1:-1;
    if(sortKey==='name')return a.name.localeCompare(b.name,'ja');
    if(sortKey==='overall')return(b.rOverall||0)-(a.rOverall||0);
    if(sortKey==='status')return(a.status||0)-(b.status||0);
    return b.updatedAt-a.updatedAt;
  });
  document.getElementById('company-count').textContent=`${companies.length} 社登録済み`;
  const list=document.getElementById('card-list');
  if(!sorted.length){list.innerHTML='<div class="empty-state">まだ企業が登録されていません。<br>「＋ 企業を追加」から始めましょう。</div>';return;}
  list.innerHTML=sorted.map(c=>{
    const priorClass=c.priority==='high'?'priority-high':c.priority==='mid'?'priority-mid':'';
    const statusN=parseInt(c.status)||0;
    const closedClass=isClosed(c)?'is-closed':''; // ボツ・不採用/辞退はグレーアウト
    return`<div class="card ${priorClass} ${closedClass}" onclick="openForm('${c.id}')">
      <div class="card-top"><div><div class="card-name">${esc(c.name)}${c.updatedBy&&c.updatedBy!==session.username?'<span class="update-badge">🔔 更新</span>':''}</div>${c.industry?`<span class="card-industry">${esc(c.industry)}</span>`:''}</div>
      <span class="status-badge status-${statusN}">${STATUS_LABELS[statusN]}</span></div>
      <div class="card-meta">
        ${c.location?`<span class="card-meta-item">📍 ${esc(c.location)}</span>`:''}
        ${c.rOverall?`<span class="card-meta-item">総合 <span class="stars">${renderStars(c.rOverall)}</span></span>`:''}
        ${c.priority&&c.priority!=='0'?`<span class="card-meta-item">優先度：${PRIORITY_LABELS[c.priority]}</span>`:''}
      </div></div>`;
  }).join('');
}

function renderCompare(){
  // フィルターUI生成（初回のみ）
  const filterWrap=document.getElementById('compare-filter');
  if(!filterWrap.hasChildNodes()){
    filterWrap.innerHTML='<span class="compare-filter-title">表示する選考状況：</span>'
      +STATUS_LABELS.map((label,i)=>
        `<label><input type="checkbox" class="compare-filter-cb" value="${i}" checked onchange="renderCompare()">${label}</label>`
      ).join('');
  }

  const checked=new Set([...document.querySelectorAll('.compare-filter-cb:checked')].map(el=>Number(el.value)));

  const tbody=document.getElementById('compare-tbody');
  const filtered=companies.filter(c=>checked.has(parseInt(c.status)||0));
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="10" style="text-align:center;opacity:0.4;padding:40px">表示できる企業がありません</td></tr>';return;}
  tbody.innerHTML=filtered.map(c=>`<tr>
    <td class="company-name-cell" onclick="openForm('${c.id}')">${esc(c.name)}${c.updatedBy&&c.updatedBy!==session.username?'<span class="update-badge">🔔 更新</span>':''}${(()=>{let items=[];try{const p=JSON.parse(c.url||'[]');if(Array.isArray(p))items=p.map(x=>typeof x==='object'?x:{label:'',url:x});else if(c.url)items=[{label:'',url:c.url}];}catch(e){if(c.url)items=[{label:'',url:c.url}];}return items.map((item,i)=>`<a href="${esc(item.url)}" target="_blank" onclick="event.stopPropagation()" style="font-size:0.7rem;opacity:0.6;font-family:sans-serif;margin-left:4px;">🔗${item.label||(items.length>1?i+1:'')}</a>`).join('');})()}</td>
    <td>${esc(c.industry)}</td><td>${esc(c.location)}</td><td>${esc(c.salary)}</td>
    <td class="rating-cell">${renderStars(c.rWork)}</td><td class="rating-cell">${renderStars(c.rCulture)}</td>
    <td class="rating-cell">${renderStars(c.rSupport)}</td><td class="rating-cell">${renderStars(c.rOverall)}</td>
    <td>${c.priority&&c.priority!=='0'?PRIORITY_LABELS[c.priority]:'─'}</td>
    <td><span class="status-badge status-${parseInt(c.status)||0}">${STATUS_LABELS[parseInt(c.status)||0]}</span></td>
  </tr>`).join('');
}

// ─── 動的URL欄 ───
const URL_MAX=5;
function setUrlList(urls){
  const list=document.getElementById('url-list');
  if(!list)return;
  list.innerHTML='';
  const arr=urls.length>0?urls:[{label:'',url:''}];
  arr.forEach(item=>addUrlRow(typeof item==='string'?item:(item.url||''),item.label||''));
  syncAddBtn();
}
function addUrlRow(urlVal,labelVal){
  const list=document.getElementById('url-list');
  if(!list||list.children.length>=URL_MAX)return;
  const row=document.createElement('div');
  row.className='url-row';

  const labelInp=document.createElement('input');
  labelInp.type='text';labelInp.className='url-row-label';
  labelInp.placeholder='名前（任意）';labelInp.value=labelVal||'';

  const urlInp=document.createElement('input');
  urlInp.type='url';urlInp.placeholder='https://...';urlInp.value=urlVal||'';

  const openA=document.createElement('a');
  openA.className='btn-url-open';openA.target='_blank';openA.rel='noopener noreferrer';openA.textContent='開く ↗';
  const v=urlVal||'';
  openA.style.display=(v&&(v.startsWith('http://')||v.startsWith('https://')))?'inline-block':'none';
  if(openA.style.display==='inline-block')openA.href=v;

  urlInp.addEventListener('input',()=>{
    const val=urlInp.value.trim();
    if(val&&(val.startsWith('http://')||val.startsWith('https://'))){openA.href=val;openA.style.display='inline-block';}
    else{openA.style.display='none';}
  });

  const removeBtn=document.createElement('button');
  removeBtn.type='button';removeBtn.className='btn-url-remove';removeBtn.textContent='×';
  removeBtn.onclick=()=>{if(confirm('このURL欄を削除しますか？')){row.remove();syncAddBtn();}};

  row.appendChild(labelInp);row.appendChild(urlInp);row.appendChild(openA);row.appendChild(removeBtn);
  list.appendChild(row);
  syncAddBtn();
}
function getUrlList(){
  return [...document.querySelectorAll('#url-list .url-row')].map(row=>{
    const inputs=row.querySelectorAll('input');
    const label=inputs[0]?.value.trim()||'';
    const url=inputs[1]?.value.trim()||'';
    return{label,url};
  }).filter(item=>item.url);
}
function syncAddBtn(){
  const list=document.getElementById('url-list');
  const btn=document.getElementById('btn-url-add');
  if(!list||!btn)return;
  btn.style.display=list.children.length>=URL_MAX?'none':'inline-block';
}

// ─── 日程（フォーム入力欄） ───
const EVENT_TYPES={
  deadline:{label:'書類提出期限',short:'期限'},
  interview:{label:'面接',short:'面接'},
  briefing:{label:'説明会・選考会',short:'説明'},
  practicum:{label:'実習',short:'実習'},
  other:{label:'その他',short:'他'}
};
const DOW_LABELS=['日','月','火','水','木','金','土'];

function pad2(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseYmd(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function cmpEvent(a,b){return(a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99'));}

// ─── 複数日にわたる予定（実習など）。endDate があれば date〜endDate の期間 ───
const MAX_SPAN_DAYS=60; // 描画する日数の上限（入力ミスで何か月分も塗りつぶさないため）
function lastDate(e){return e.endDate||e.date;}
// 終了日として有効か（開始日より後で、開始日から MAX_SPAN_DAYS 日以内）
function validEnd(date,end){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(end||'')||!date||end<=date)return false;
  return Math.round((parseYmd(end)-parseYmd(date))/86400000)<MAX_SPAN_DAYS;
}
function maxEnd(date){const d=parseYmd(date);return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+MAX_SPAN_DAYS-1));}
function dayCount(e){return e.endDate?Math.round((parseYmd(e.endDate)-parseYmd(e.date))/86400000)+1:1;}
function fmtMD(s){const d=parseYmd(s);return(d.getMonth()+1)+'/'+d.getDate();}
function rangeLabel(e){return e.endDate?fmtMD(e.date)+'〜'+fmtMD(e.endDate)+'（'+dayCount(e)+'日間）':'';}
// 予定が含まれる日付（YYYY-MM-DD）の一覧
function eventDays(e){
  const out=[e.date];
  if(!e.endDate)return out;
  const end=parseYmd(e.endDate);
  let d=parseYmd(e.date);
  for(let n=0;n<MAX_SPAN_DAYS;n++){
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    if(d>end)break;
    out.push(ymd(d));
  }
  return out;
}
// ボツ・不採用/辞退の企業（カレンダーの追加候補から外し、予定は薄く表示する）
function isClosed(c){const st=parseInt(c.status)||0;return st===1||st===5;}

// 企業の events（JSON文字列）を安全に配列へ。壊れていれば空配列
function parseEvents(c){
  if(!c||!c.events)return[];
  try{
    const p=typeof c.events==='string'?JSON.parse(c.events):c.events;
    if(!Array.isArray(p))return[];
    return p.filter(e=>e&&typeof e==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date||''))
      .map(e=>{
        const o={type:EVENT_TYPES[e.type]?e.type:'other',date:e.date,time:e.time||'',note:e.note||''};
        if(validEnd(e.date,e.endDate))o.endDate=e.endDate;
        return o;
      });
  }catch(err){return[];}
}

function setEventList(events){
  const list=document.getElementById('event-list');
  if(!list)return;
  list.innerHTML='';
  events.forEach(e=>addEventRow(e));
}
function addEventRow(ev){
  const list=document.getElementById('event-list');
  if(!list)return;
  ev=(ev&&typeof ev==='object'&&!(ev instanceof Event))?ev:{};
  const row=document.createElement('div');
  row.className='event-row';

  const sel=document.createElement('select');
  sel.className='evf-type';
  Object.keys(EVENT_TYPES).forEach(k=>{
    const o=document.createElement('option');
    o.value=k;o.textContent=EVENT_TYPES[k].label;sel.appendChild(o);
  });
  sel.value=EVENT_TYPES[ev.type]?ev.type:'deadline';

  const date=document.createElement('input');
  date.type='date';date.className='evf-date';date.value=ev.date||'';

  // 終了日（実習のように複数日にわたる予定のときだけ表示）
  const endWrap=document.createElement('span');
  endWrap.className='evf-end-wrap';
  endWrap.appendChild(document.createTextNode('〜 終了日'));
  const end=document.createElement('input');
  end.type='date';end.className='evf-end';end.value=ev.endDate||'';
  endWrap.appendChild(end);
  const syncEnd=()=>{
    endWrap.style.display=sel.value==='practicum'?'flex':'none';
    end.min=date.value||'';
    end.max=date.value?maxEnd(date.value):'';
  };
  sel.addEventListener('change',syncEnd);
  date.addEventListener('change',syncEnd);
  syncEnd();

  const time=document.createElement('input');
  time.type='time';time.className='evf-time';time.value=ev.time||'';

  const note=document.createElement('input');
  note.type='text';note.className='evf-note';note.placeholder='メモ（任意）';note.value=ev.note||'';

  const rm=document.createElement('button');
  rm.type='button';rm.className='btn-url-remove';rm.textContent='×';
  rm.onclick=()=>row.remove();

  row.appendChild(sel);row.appendChild(date);row.appendChild(endWrap);row.appendChild(time);row.appendChild(note);row.appendChild(rm);
  list.appendChild(row);
}
// 日付が入っている行だけを、日付順にして返す
function getEventList(){
  return [...document.querySelectorAll('#event-list .event-row')].map(row=>{
    const e={
      type:row.querySelector('.evf-type').value,
      date:row.querySelector('.evf-date').value,
      time:row.querySelector('.evf-time').value,
      note:row.querySelector('.evf-note').value.trim()
    };
    const end=row.querySelector('.evf-end').value;
    if(e.type==='practicum'&&validEnd(e.date,end))e.endDate=end; // 開始日以前・長すぎる終了日は無視
    return e;
  }).filter(e=>e.date).sort(cmpEvent);
}

// ─── カレンダー ───
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),calSelected=null,qaBusy=false;
// 管理者用：全利用者のデータ。allData = { シート名: {label, companies:[...]} }
let userList=[],allData=null,calScope='',calLoading=false,calEvs=[];
const isAdmin=()=>!!session&&session.role==='admin';

// カレンダーの元データ。利用者は自分の企業、管理者は（絞り込み中の）全利用者の企業
function calSources(){
  if(isAdmin()){
    if(!allData)return[];
    return Object.keys(allData).filter(k=>!calScope||k===calScope).map(k=>({sheet:k,owner:allData[k].label,companies:allData[k].companies}));
  }
  return[{sheet:null,owner:'',companies:companies}];
}

// 全企業の予定を日付順にまとめる（ボツ・不採用/辞退の企業は inactive=true）
function allEvents(){
  const out=[];
  calSources().forEach(s=>s.companies.forEach(c=>{
    parseEvents(c).forEach(e=>out.push({...e,companyId:c.id,companyName:c.name||'',inactive:isClosed(c),sheet:s.sheet,owner:s.owner}));
  }));
  return out.sort(cmpEvent);
}
function evLabel(e){return EVENT_TYPES[e.type].label+(e.endDate?'（'+rangeLabel(e)+'）':'')+(e.time?' '+e.time:'')+' '+(e.owner?e.owner+'：':'')+e.companyName+(e.note?'：'+e.note:'');}

function setCalStatus(msg){const el=document.getElementById('cal-status');if(el)el.textContent=msg||'';}
function calSetScope(v){calScope=v;calSelected=null;renderCalendar();}

// 管理者：全利用者のシートを並列に読み込む（一部失敗しても、取れた分は表示する）
async function loadAllSheets(){
  if(calLoading)return;
  calLoading=true;
  if(!allData)setCalStatus('読み込み中…');
  try{
    if(!userList.length){
      const r=await api({action:'getUsers'});
      if(r.error)throw new Error(r.error);
      userList=r.users||[];
    }
    const targets=userList.filter(u=>u.role!=='admin'&&u.sheetName);
    const res=await Promise.all(targets.map(async u=>{
      try{
        const r=await api({action:'getAll',sheetName:u.sheetName});
        if(r.error)throw new Error(r.error);
        return{u,list:(r.companies||[]).map(normCompany)};
      }catch(e){return{u,err:e.message};}
    }));
    const next={},errs=[];
    res.forEach(x=>{
      const k=x.u.sheetName;
      if(x.err){errs.push(k+'（'+x.err+'）');if(allData&&allData[k])next[k]=allData[k];}
      else next[k]={label:k,companies:x.list};
    });
    allData=next;
    setCalStatus(errs.length?'一部の利用者のデータを読み込めませんでした：'+errs.join('、'):'');
  }catch(e){
    setCalStatus('読み込みに失敗しました：'+e.message);
  }finally{
    calLoading=false;
  }
  if(document.getElementById('page-calendar').classList.contains('active'))renderCalendar();
}

function calMove(delta){
  calMonth+=delta;
  if(calMonth<0){calMonth=11;calYear--;}
  else if(calMonth>11){calMonth=0;calYear++;}
  calSelected=null;
  renderCalendar();
}
function calToday(){
  const d=new Date();
  calYear=d.getFullYear();calMonth=d.getMonth();calSelected=ymd(d);
  renderCalendar();
}
function calSelect(ds){calSelected=(calSelected===ds)?null:ds;renderCalendar();}
function openFormFromCalendar(id,sheet){
  if(isAdmin()&&sheet){
    // 管理者：その利用者を「選択中」にしてフォームを開く（以降のロック・保存はその利用者のシートに対して行われる）
    currentSheetName=sheet;
    companies=allData&&allData[sheet]?allData[sheet].companies:[];
    const sel=document.getElementById('admin-user-select');
    if(sel)sel.value=sheet;
  }
  return openForm(id,'calendar');
}
// 予定の番号（calEvs の添字）から企業のフォームを開く。シート名を onclick に埋め込まないための間接参照
function openCalEvent(i){const e=calEvs[i];if(e)return openFormFromCalendar(e.companyId,e.sheet);}

function renderCalendar(){
  document.getElementById('cal-title').textContent=calYear+'年'+(calMonth+1)+'月';
  document.getElementById('cal-legend').innerHTML=Object.keys(EVENT_TYPES).map(k=>`<span><i class="ev-${k}"></i>${EVENT_TYPES[k].label}</span>`).join('');

  // 管理者：表示する利用者の絞り込み（既定は全員）
  const scopeSel=document.getElementById('cal-scope');
  if(isAdmin()){
    const keys=allData?Object.keys(allData):[];
    if(calScope&&!keys.includes(calScope))calScope='';
    scopeSel.innerHTML='<option value="">全員</option>'+keys.map(k=>`<option value="${esc(k)}">${esc(allData[k].label)}</option>`).join('');
    scopeSel.value=calScope;
    scopeSel.style.display='inline-block';
  }else{
    scopeSel.style.display='none';
  }

  const evs=allEvents(),byDate={};
  evs.forEach((e,i)=>{e._i=i;});
  calEvs=evs;
  // 複数日にわたる予定は、期間の各日に登録する
  evs.forEach(e=>{eventDays(e).forEach(ds=>{(byDate[ds]=byDate[ds]||[]).push(e);});});
  const today=ymd(new Date());
  const startDow=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const total=Math.ceil((startDow+days)/7)*7;
  let html='';
  for(let i=0;i<total;i++){
    const d=new Date(calYear,calMonth,i-startDow+1);
    const ds=ymd(d),dow=d.getDay(),list=byDate[ds]||[];
    const chips=list.map((e,k)=>{
      const cont=ds!==e.date; // 複数日の2日目以降
      return`<div class="cal-chip ev-${e.type}${e.inactive?' ev-inactive':''}${k>=3?' extra':''}" onclick="event.stopPropagation();openCalEvent(${e._i})" title="${esc(evLabel(e))}"><span class="chip-text">${cont?'↳ ':(e.time?esc(e.time)+' ':'')}${e.owner?`<b>${esc(e.owner)}</b> `:''}${esc(e.companyName)}</span></div>`;
    }).join('')
      +(list.length>3?`<div class="cal-more">+${list.length-3}件</div>`:'');
    html+=`<div class="cal-cell${d.getMonth()!==calMonth?' out':''}${ds===today?' today':''}${ds===calSelected?' selected':''}${dow===0?' sun':dow===6?' sat':''}" onclick="calSelect('${ds}')"><div class="cal-day">${d.getDate()}</div><div class="cal-events">${chips}</div></div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
  renderCalDetail(byDate);
  renderUpcoming(evs);
}

// 選択した日の予定一覧と、その場での予定追加フォーム
function renderCalDetail(byDate){
  const box=document.getElementById('cal-detail');
  if(!calSelected){
    box.innerHTML='<div class="cal-hint">日付をクリックすると、その日の予定の確認・追加ができます。</div>';
    return;
  }
  const d=parseYmd(calSelected),list=byDate[calSelected]||[];
  const rows=list.length?list.map(e=>`<div class="cal-ev-row"><span class="ev-tag ev-${e.type}">${EVENT_TYPES[e.type].short}</span>${e.time?`<span class="cal-ev-time">${esc(e.time)}</span>`:''}${e.owner?`<span class="cal-ev-owner">${esc(e.owner)}</span>`:''}<span class="cal-ev-name" onclick="openCalEvent(${e._i})">${esc(e.companyName)}</span>${e.endDate?`<span class="cal-ev-note">${rangeLabel(e)}</span>`:''}${e.note?`<span class="cal-ev-note">${esc(e.note)}</span>`:''}${e.inactive?'<span class="cal-ev-note">（選考終了）</span>':''}</div>`).join('')
    :'<div class="cal-ev-row cal-ev-note">この日の予定はありません。</div>';
  // 追加先の企業（ボツ・不採用/辞退は除く）。管理者は利用者ごとにグループ分けし、value に「シート名|企業ID」を持たせる
  const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','ja');
  let opts='',hasCompany=false;
  calSources().forEach(s=>{
    const os=s.companies.filter(c=>!isClosed(c)).sort(byName).map(c=>`<option value="${esc((s.sheet?encodeURIComponent(s.sheet)+'|':'')+c.id)}">${esc(c.name)}</option>`).join('');
    if(!os)return;
    hasCompany=true;
    opts+=s.sheet?`<optgroup label="${esc(s.owner)}">${os}</optgroup>`:os;
  });
  const add=hasCompany
    ?`<div class="cal-add"><select id="qa-company"><option value="">企業を選択</option>${opts}</select><select id="qa-type" onchange="qaTypeChanged()">${Object.keys(EVENT_TYPES).map(k=>`<option value="${k}">${EVENT_TYPES[k].label}</option>`).join('')}</select><span class="qa-end-wrap" id="qa-end-wrap" style="display:none;">〜 終了日<input type="date" id="qa-end" min="${calSelected}" max="${maxEnd(calSelected)}"></span><input type="time" id="qa-time"><input type="text" id="qa-note" class="qa-note" placeholder="メモ（任意）"><button class="btn-sm" onclick="quickAddEvent()">＋ 追加</button></div>`
    :'<div class="cal-hint">予定を追加できる企業がありません（ボツ・不採用の企業は対象外です）。'+(isAdmin()?'':'先に「一覧」から企業を登録してください。')+'</div>';
  box.innerHTML=`<div class="cal-detail-box"><div class="cal-detail-head">${d.getMonth()+1}月${d.getDate()}日（${DOW_LABELS[d.getDay()]}）</div>${rows}${add}</div>`;
}

function renderUpcoming(evs){
  const box=document.getElementById('cal-upcoming');
  const today=ymd(new Date()),t0=parseYmd(today);
  // 実施中の複数日の予定（開始済みで終了日が今日以降）も含める
  const up=evs.filter(e=>!e.inactive&&lastDate(e)>=today).slice(0,20);
  if(!up.length){box.innerHTML='<div class="cal-hint">今後の予定はありません。</div>';return;}
  box.innerHTML=up.map(e=>{
    const d=parseYmd(e.date),diff=Math.round((d-t0)/86400000);
    const rel=diff<0?'実施中':diff===0?'今日':diff===1?'明日':'あと'+diff+'日';
    const dateLabel=e.endDate?fmtMD(e.date)+'〜'+fmtMD(e.endDate):d.getMonth()+1+'/'+d.getDate()+'（'+DOW_LABELS[d.getDay()]+'）';
    return`<div class="cal-up-row ev-b-${e.type}" onclick="openCalEvent(${e._i})"><span class="cal-up-date">${dateLabel}</span><span class="ev-tag ev-${e.type}">${EVENT_TYPES[e.type].short}</span>${e.time?`<span class="cal-ev-time">${esc(e.time)}</span>`:''}${e.owner?`<span class="cal-ev-owner">${esc(e.owner)}</span>`:''}<span class="cal-ev-name">${esc(e.companyName)}</span>${e.note?`<span class="cal-ev-note">${esc(e.note)}</span>`:''}<span class="cal-up-rel${diff<=3?' soon':''}">${rel}</span></div>`;
  }).join('');
}

// 追加フォーム：種類が「実習」のときだけ終了日の欄を出す
function qaTypeChanged(){
  const wrap=document.getElementById('qa-end-wrap');
  if(wrap)wrap.style.display=document.getElementById('qa-type').value==='practicum'?'flex':'none';
}

// カレンダー上で選んだ日に予定を追加する（企業のロック→保存→解除）
async function quickAddEvent(){
  if(qaBusy)return;
  const val=document.getElementById('qa-company').value;
  if(!val){showToast('企業を選択してください');return;}
  // 管理者の場合 value は「シート名|企業ID」。利用者の場合は企業IDのみ
  let sheet=null,cid=val;
  const bar=val.indexOf('|');
  if(bar>=0){sheet=decodeURIComponent(val.slice(0,bar));cid=val.slice(bar+1);}
  const list=sheet?(allData&&allData[sheet]?allData[sheet].companies:[]):companies;
  const c=list.find(x=>x.id===cid);
  if(!c||!calSelected)return;
  const ctx=sheet?{sheetName:sheet}:{}; // 管理者は対象の利用者のシートを明示（選択中の利用者は変えない）
  const ev={type:document.getElementById('qa-type').value,date:calSelected,time:document.getElementById('qa-time').value,note:document.getElementById('qa-note').value.trim()};
  if(ev.type==='practicum'){
    const end=document.getElementById('qa-end').value;
    if(end&&end<calSelected){showToast('終了日は開始日（'+fmtMD(calSelected)+'）以降にしてください');return;}
    if(end&&end>calSelected){
      if(!validEnd(calSelected,end)){showToast('終了日は開始日から'+MAX_SPAN_DAYS+'日以内にしてください');return;}
      ev.endDate=end;
    }
  }
  qaBusy=true;
  let locked=false;
  showToast('追加中…');
  try{
    const lock=await api({action:'lock',id:cid,...ctx});
    if(lock.error==='locked'){showToast('現在「'+lock.lockedBy+'」が編集中です');return;}
    if(lock.error)throw new Error(lock.error);
    locked=true;
    const {lockedBy,lockedAt,...rest}=c; // 古いロック情報は保存データに含めない
    const events=[...parseEvents(c),ev].sort(cmpEvent);
    const data={...rest,events:JSON.stringify(events),updatedAt:Date.now()};
    const result=await api({action:'save',data,...ctx});
    if(result.error)throw new Error(result.error);
    const idx=list.findIndex(x=>x.id===cid);
    if(idx>=0)list[idx]=data;
    // 選択中の利用者の一覧（companies）にも反映する。そうしないと、後でフォームから保存したときに追加した予定が消える
    if(sheet&&sheet===currentSheetName&&companies!==list){
      const j=companies.findIndex(x=>x.id===cid);
      if(j>=0)companies[j]=data;
    }
    showToast('追加しました');
    renderCalendar();
  }catch(e){
    showToast('追加に失敗しました：'+e.message);
  }finally{
    if(locked){try{await api({action:'unlock',id:cid,...ctx});}catch(e){}}
    qaBusy=false;
  }
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2500);}
</script>
